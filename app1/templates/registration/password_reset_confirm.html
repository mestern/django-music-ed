{% load static %}
{% include "partials/messages.html" %}


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>password reset</title>
    <link rel="stylesheet" type="text/css" href="{% static 'css/password_change_form.css' %}">

</head>
<body>
<div class="form-container">

    {% if validlink %}
        <h2>Enter your new password</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <input type="submit" value="change password">
        </form>

        {% else %}
         invalid Chane password link
    {% endif %}



</div>

</body>
</html>
